version: "3.1"

intents:
  - affirm
  - greet
  - ask_course_info
  - ask_duration
  - ask_fees
  - ask_eligibility
  - ask_admission_process
  - ask_placement
  - ask_prerequisite
  - ask_contact
  - goodbye
  - thankyou
  - ask_start_date
  - ask_mode
  - ask_scholarship
  - ask_topics
  - ask_budget
  - ask_practice
  - deny
  - inform_course_level

entities:
  - course
  - duration
  - location
  - course_level
  - mode
  - start_date
  - discount
  - problem_topic
  - budget

slots:
  course_level:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: course_level

  course:
    type: text
    mappings:
      - type: from_entity
        entity: course

  duration:
    type: text
    mappings:
      - type: from_entity
        entity: duration

  budget:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: budget

  mode:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: mode


responses:
  utter_greet:
    - text: "Hello 👋! I’m your Data Science course assistant. How can I help you today?"

  utter_goodbye:
    - text: "👋 Goodbye! Come back anytime if you have more questions."

  utter_thankyou:
    - text: "You're welcome 😊 Let me know if you need anything else."

  utter_course_info:
    - text: |
        📘 **Data Science Program Overview**
        Our course includes:
        • Python Programming  
        • Machine Learning (ML)  
        • Deep Learning (DL)  
        • Natural Language Processing (NLP)  
        • Data Visualization  
        • Real-world Projects & Case Studies

  utter_eligibility:
    - text: |
        🎯 **Eligibility Criteria**
        • Any Bachelor's degree (any stream)  
        • Basic programming knowledge (preferably Python)  
        • Comfortable with high-school level math

  utter_prerequisite:
    - text: |
        ✅ **Recommended Prerequisites**
        • Familiarity with Python  
        • Basic statistics & probability  
        • Logical thinking skills

  utter_placement:
    - text: |
        💼 **Placement Assistance**
        Yes! We offer:
        • Resume building  
        • Mock interviews  
        • Industry connections  
        • Job referrals to hiring partners

  utter_contact:
    - text: |
        📞 **Contact Support**
        • Phone: +91-12345-67890  
        • Email: support@example.com

  utter_start_date:
    - text: |
        📅 **Next Batch Alert**
        The upcoming batch starts on **{start_date}**.

  utter_mode:
    - text: |
        🖥️ We offer:
        • Online (live + recorded)  
        • Offline (in select cities)  
        • Hybrid mode (flexible)

  utter_scholarship:
    - text: |
        🎓 **Scholarships & Offers**
        • Early-bird discount: up to 15%  
        • Merit-based scholarship  
        • Group discounts available too!

  utter_topics:
    - text: |
        📚 **Topics You'll Master**
        • Python, Pandas, NumPy  
        • Machine Learning (supervised & unsupervised)  
        • Deep Learning (CNNs, RNNs)  
        • NLP  
        • Data Visualization  
        • Model deployment using Flask/Streamlit

  utter_budget:
    - text: |
        💸 Based on your budget of ₹{budget}, I recommend our **Certificate Program**.
        It includes:
        • 8-week hands-on training  
        • Key ML modules  
        • 2 real-world projects

  utter_practice:
    - text: |
        🧪 **Hands-on Learning**
        • 10+ coding assignments  
        • 3 major capstone projects  
        • Mini real-world case studies  
        • Code reviews & feedback

  utter_ask_show_batches:
    - text: "Would you like to see upcoming batch dates?"

  utter_agree:
    - text: 
        "👍 Great! Let me know how else I can help. 
         Feel free to ask about fees, topics, or placements."

              

actions:
  - action_list_upcoming_batches
  - action_course_duration
  - action_provide_course_fee
  - action_show_course_topics
  - action_scholarship_info
  - action_course_mode
  - action_course_practice
  - action_course_recommendation_by_budget
  - action_provide_admission_link

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

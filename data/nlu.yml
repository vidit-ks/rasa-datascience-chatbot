version: "3.1"
nlu:

- intent: greet
  examples: |
    - hi
    - hello
    - hey there
    - good morning
    - hi bot
    - yo
    - hey!

- intent: goodbye
  examples: |
    - goodbye
    - bye
    - see ya
    - talk to you later
    - end chat
    - exit

- intent: thankyou
  examples: |
    - thanks
    - thank you
    - appreciate it
    - cheers
    - thank you so much
    - nice, thanks

- intent: ask_course_info
  examples: |
    - what is the [data science](course) course about
    - tell me about your [machine learning](course) course
    - what does [AI](course) program include
    - what topics are covered in the [DS](course) course
    - give me [data science](course) course details
    - I want to know about [DS and ML](course)

- intent: ask_duration
  examples: |
    - how long is the [data science](course) course
    - what's the duration of [AI](course)
    - duration of [ML](course)
    - total time required for [ds](course)
    - how many weeks is the [data science](course) bootcamp

- intent: ask_fees
  examples: |
    - how much does the [data science](course) course cost
    - what's the fee for [beginner](course_level)
    - tell me about [intermediate](course_level) course fee
    - I want the fee for [advanced](course_level)
    - what is the price of [data science](course)
    - is there any discount for [intermediate](course_level)

- intent: ask_eligibility
  examples: |
    - am I eligible for the [data science](course) course
    - who can apply for [AI](course)
    - what background is required
    - I'm from commerce, can I take this

- intent: ask_admission_process
  examples: |
    - how can I apply
    - tell me the admission process
    - guide me through the enrollment
    - is it online admission
    - where can I fill the form

- intent: ask_placement
  examples: |
    - do you offer placement assistance
    - what are the placement opportunities
    - will I get job support
    - is job placement guaranteed

- intent: ask_prerequisite
  examples: |
    - do I need programming experience
    - is [Python](problem_topic) necessary
    - any required background knowledge
    - is this beginner-friendly

- intent: ask_contact
  examples: |
    - what’s the contact number
    - provide email address
    - can someone call me
    - help me contact support

- intent: ask_start_date
  examples: |
    - when does the next [data science](course) batch start
    - start date for [AI](course)
    - upcoming batch dates
    - when can I start

- intent: ask_mode
  examples: |
    - Do you offer an [online](mode) data science course?
    - I prefer [online](mode) mode — is that possible?
    - I want to take the course [offline](mode)
    - Is [hybrid](mode) available?
    - [online](mode)
    - [offline](mode)
    - [hybrid](mode)
    - Can I attend remotely?
    - Are classes in-person or blended?
    - Is the course available remotely?
    - Is it online?


- intent: ask_scholarship
  examples: |
    - are there any scholarships
    - do you offer early-bird discounts
    - I want to apply for financial aid
    - is any discount available

- intent: ask_topics
  examples: |
    - what does the curriculum include
    - tell me about [ML](course) and [NLP](course) topics
    - do you teach [deep learning](course)
    - show [data science](course) subjects


- intent: ask_budget
  examples: |
    - my budget is [30000](budget)
    - I can spend [40000](budget)
    - I have [35000](budget)
    - I can pay [30k](budget)
    - [25k](budget)
    - I can afford up to [₹40,000](budget)
    - [₹30k](budget)
    - [40k](budget)


- intent: ask_practice
  examples: |
    - does the course include hands-on coding
    - will I get to build something
    - are there mini projects
    - will there be assignments
    - is it theory or practical based

- intent: agree
  examples: |
    - yes
    - yeah
    - sure
    - absolutely
    - definitely
    - of course
    - sounds good
    - yup
    - I would like that
    - go ahead
    - okay

- intent: deny
  examples: |
    - no
    - nope
    - not now
    - maybe later
    - not interested
    - cancel that
    - no thanks

- intent: inform_course_level
  examples: |
    - [beginner](course_level)
    - [intermediate](course_level)
    - [advanced](course_level)
    - I’m a [beginner](course_level)
    - I want [intermediate](course_level)
    - I'm at [advanced](course_level) level
    - looking for [beginner](course_level) course
    - show [advanced](course_level) course fee
    - [intermediate](course_level) program fees




- synonym: online
  examples: |
    - remote
    - virtually
    - attend from home

- synonym: offline
  examples: |
    - in-person
    - classroom

- synonym: hybrid
  examples: |
    - both modes
    - blended
    - mix of online and offline
